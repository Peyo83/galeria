services:
  postgres:
    image: postgres:15-alpine
    container_name: galeria_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - galeria_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
    networks:
      - galeria_network_global
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: galeria_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
    networks:
      - galeria_network_global
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: galeria_frontend
    restart: always
    environment:
      - NUXT_PUBLIC_API_BASE=http://backend:8000/api/v1
      - NUXT_PUBLIC_MEDIA_BASE=http://localhost:8000/media
    ports:
      - "3000:3000"
    networks:
      - galeria_network_global
    depends_on:
      - backend

volumes:
  galeria_postgres_data:
    name: galeria_postgres_data

networks:
  galeria_network_global:
    driver: bridge
    name: galeria_network_global